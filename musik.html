<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Musik (Passiver Buzzer)</title>
  <style>
    :root{
      --ui:#101522; --fg:#e6f0ff; --muted:#8b94a5; --accent:#3ea6ff;
      --bg:#050913; --card:#0c1120; --border:#ffffff1f; --shadow:0 10px 24px #0007;
    }
    body{ margin:16px; font-family:system-ui,sans-serif; background:var(--bg); color:var(--fg); }
    a{ color:var(--accent); text-decoration:none; }
    a:hover{ text-decoration:underline; }

    #wrap{ max-width: 980px; margin:0 auto; display:grid; grid-template-columns: 1fr 340px; gap:16px; align-items:start; }
    @media (max-width: 900px){ #wrap{ grid-template-columns: 1fr; } }

    .card{ background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px; box-shadow: var(--shadow); }
    .title{ font-weight:650; margin-bottom:10px; }
    .meta{ font-size:12px; color:var(--muted); }

    .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .row > * { flex: 1 1 auto; }

    button, select, input[type="range"]{
      background:#080c16; color:var(--fg); border:1px solid var(--border);
      border-radius:10px; padding:8px 10px; font:inherit; width:100%; box-sizing:border-box;
    }
    input[type="range"]{ padding:8px 0; accent-color:var(--accent); }
    button{ cursor:pointer; }
    button.primary{ background:var(--accent); color:#08111f; border-color:transparent; }
    button.ghost{ background:transparent; }
    button:disabled{ cursor:not-allowed; opacity:0.55; }

    hr{ border:none; border-top:1px solid var(--border); margin:14px 0; }
    code{ color:var(--fg); }
  </style>
</head>

<body>
  <div id="wrap">

    <section class="card">
      <div class="title">Musik (passiver Buzzer)</div>

      <div class="row" style="margin-bottom:10px">
        <a href="/">← Zurück zum Painter</a>
      </div>

      <p class="meta">
        Passiver Buzzer spielt <b>echte Tonhöhen</b> und kleine Melodien.
        <br>Pin: <code id="pin">?</code>
      </p>

      <hr>

      <label class="meta" for="song">Song / Melodie</label>
      <div class="row">
        <select id="song"></select>
      </div>

      <div class="row" style="margin-top:10px">
        <button id="btnPlay" class="primary">Start</button>
        <button id="btnStop" class="ghost">Stopp</button>
      </div>

      <div class="row" style="margin-top:10px">
        <label class="meta" style="flex:0 0 auto; width:auto;">
          <input type="checkbox" id="repeat" checked>
          Wiederholen
        </label>
      </div>

      <div style="margin-top:10px">
        <label class="meta" for="volume">Lautstaerke: <span id="volumeValue">100</span>%</label>
        <input id="volume" type="range" min="0" max="100" value="100">
      </div>

      <p id="msg" class="meta" style="margin-top:10px"></p>
    </section>

    <aside class="card">

      <hr>

      <div class="title">Hinweis</div>
      <p class="meta">
      </p>
    </aside>

  </div>

<script>
(() => {
  const songEl = document.getElementById('song');
  const btnPlay = document.getElementById('btnPlay');
  const btnStop = document.getElementById('btnStop');
  const repeatEl = document.getElementById('repeat');
  const volumeEl = document.getElementById('volume');
  const volumeValueEl = document.getElementById('volumeValue');
  const msg = document.getElementById('msg');
  const pinEl = document.getElementById('pin');
  let volumeTimer = null;

  function setMsg(t){ msg.textContent = t || ""; }

  async function loadSongs(){
    setMsg("Lade Songs…");
    const r = await fetch('/api/music/list', { cache: 'no-store' });
    const j = await r.json().catch(()=>null);
    if (!j || !Array.isArray(j.songs)) { setMsg("Konnte Songs nicht laden."); return; }

    pinEl.textContent = String(j.pin ?? "?");
    if (typeof j.volume === 'number') {
      volumeEl.value = String(j.volume);
      volumeValueEl.textContent = String(j.volume);
    }

    songEl.innerHTML = "";
    for (const s of j.songs){
      const opt = document.createElement('option');
      opt.value = s.id;
      opt.textContent = s.name + " (" + s.id + ")";
      songEl.appendChild(opt);
    }
    setMsg("");
  }

  async function play(){
    btnPlay.disabled = true;
    btnStop.disabled = true;
    setMsg("Starte…");

    const payload = { id: songEl.value, repeat: !!repeatEl.checked, volume: Number(volumeEl.value) };
    const r = await fetch('/api/music/play', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    const j = await r.json().catch(()=>({ok:false}));

    if (!j.ok) setMsg("Fehler beim Start.");
    else setMsg("Läuft.");
    btnPlay.disabled = false;
    btnStop.disabled = false;
  }

  async function stop(){
    btnPlay.disabled = true;
    btnStop.disabled = true;
    setMsg("Stoppe…");

    await fetch('/api/music/stop', { method:'POST' }).catch(()=>{});
    setMsg("Gestoppt.");
    btnPlay.disabled = false;
    btnStop.disabled = false;
  }

  function updateVolumeLabel(){
    volumeValueEl.textContent = String(volumeEl.value);
  }

  function sendVolumeSoon(){
    updateVolumeLabel();
    clearTimeout(volumeTimer);
    volumeTimer = setTimeout(async () => {
      await fetch('/api/music/volume', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ volume: Number(volumeEl.value) })
      }).catch(()=>{});
    }, 120);
  }

  btnPlay.addEventListener('click', play);
  btnStop.addEventListener('click', stop);
  volumeEl.addEventListener('input', sendVolumeSoon);

  loadSongs();
})();
</script>
</body>
</html>
